name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'

    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Upload built jar
      uses: actions/upload-artifact@v4
      with:
        name: carpet-gru-addition
        path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4

    - name: Read version from gradle.properties
      id: get_version
      run: |
        MOD_VERSION=$(grep mod_version gradle.properties | cut -d'=' -f2 | tr -d ' ')
        ARCHIVES_BASE_NAME=$(grep archives_base_name gradle.properties | cut -d'=' -f2 | tr -d ' ')
        ARTIFACT_NAME="${ARCHIVES_BASE_NAME}-${MOD_VERSION}.jar"
        echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
        echo "archives_base_name=$ARCHIVES_BASE_NAME" >> $GITHUB_OUTPUT
        echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

    - name: Download built jar
      uses: actions/download-artifact@v4
      with:
        name: carpet-gru-addition
        path: build/libs

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.mod_version }}
        release_name: ${{ steps.get_version.outputs.artifact_name }}
        body: |
          Automatic release generated by GitHub Actions
          
          Version: ${{ steps.get_version.outputs.mod_version }}
          Minecraft: 1.20.1
          Fabric: 0.92.7+1.20.1
          Carpet: 1.20-1.4.112+v230608
        draft: false
        prerelease: false

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/libs/${{ steps.get_version.outputs.artifact_name }}
        asset_name: ${{ steps.get_version.outputs.artifact_name }}
        asset_content_type: application/java-archive
